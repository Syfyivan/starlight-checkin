<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5ef">
  <title>番茄钟 · 小小成就</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./pomodoro.css">
  <script type="module" src="./pomodoro.js"></script>
</head>
<body>
  <main class="desk">
    <header><a class="brand" href="./">小小成就</a><h1>番茄钟</h1></header>
    <section class="clock" aria-label="番茄钟">
      <div class="modes" aria-label="计时模式" role="group">
        <button type="button" data-mode="focus" aria-pressed="true">专注 25 分钟</button>
        <button type="button" data-mode="rest" aria-pressed="false">休息 5 分钟</button>
      </div>
      <p class="status" role="status">准备专注</p>
      <div class="digits" role="timer" aria-label="剩余时间">25:00</div>
      <progress aria-label="本轮进度" value="0" max="1500000"></progress>
      <div class="controls">
        <button class="primary" type="button" data-command="toggle">开始专注</button>
        <button type="button" data-command="reset" disabled>重置</button>
      </div>
    </section>
    <div class="pin-tools">
      <button type="button" id="pin">桌面置顶</button>
      <p id="pin-hint" role="status"></p>
    </div>
  </main>
</body>
</html>
